name: Request build & lint

on: 
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - README.md
      - .gitignore

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: 
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci
       
      - name: Run linter
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}